    <title>KX Mods Launcher</title>
    
    <!-- MANIFEST DINAMICO PER PWA -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"KX Mods Launcher","short_name":"KX Mods","start_url":".","display":"standalone","background_color":"#050505","theme_color":"#050505","icons":[{"src":"https://i.imgur.com/8QzJqYl.png","sizes":"512x512","type":"image/png"}]}'>
    
    <style>
        :root {
            --primary: #00ff41;
            --primary-dim: rgba(0, 255, 65, 0.1);
            --bg: #050505;
            --card-bg: #111111;
            --text: #ffffff;
            --text-muted: #888888;
            --border: #222222;
            --danger: #ff3333;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 0; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg); color: var(--text);
            min-height: 100vh; display: flex; flex-direction: column;
            overflow-x: hidden; user-select: none; -webkit-user-select: none;
        }

        header {
            padding: 20px; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100; 
            background: rgba(5,5,5,0.95); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }
        .logo-area { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .logo-icon { 
            width: 45px; height: 45px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 2px solid var(--primary); 
            box-shadow: 0 0 10px var(--primary-dim); 
            background: #000;
        }
        .app-name { font-weight: 700; font-size: 18px; letter-spacing: 1px; text-transform: uppercase; color: var(--primary); text-shadow: 0 0 5px var(--primary-dim); }
        .app-version { font-size: 10px; color: var(--text-muted); margin-top: 2px; font-family: sans-serif; }

        #active-timer-container {
            position: absolute; left: 50%; transform: translateX(-50%);
            background: rgba(0, 255, 65, 0.05); padding: 6px 16px; border-radius: 4px;
            font-size: 13px; font-weight: bold; color: var(--primary); border: 1px solid var(--primary-dim);
            display: none; backdrop-filter: blur(5px); letter-spacing: 1px;
        }

        main { flex: 1; padding: 20px 20px 120px 20px; }

        .banner {
            width: 100%; height: 140px; border-radius: 8px; margin-bottom: 24px;
            background: linear-gradient(45deg, #0a0a0a, #1a1a1a);
            display: flex; align-items: center; padding: 24px; position: relative; overflow: hidden;
            border: 1px solid var(--border);
        }
        .banner::before {
            content: ''; position: absolute; top: 0; right: 0; width: 100px; height: 100%;
            background: linear-gradient(to left, var(--primary-dim), transparent);
        }
        .banner-text h2 { margin: 0 0 8px 0; font-size: 20px; color: var(--primary); }
        .banner-text p { margin: 0; color: var(--text-muted); font-size: 12px; font-family: sans-serif; }

        .game-card {
            background: var(--card-bg); border-radius: 8px; padding: 20px; margin-bottom: 16px;
            border: 1px solid var(--border); transition: all 0.2s;
        }
        .game-header { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
        .game-icon { 
            width: 60px; height: 60px; 
            border-radius: 12px; 
            object-fit: cover;
            border: 1px solid #333; 
            background: #222;
        }
        .game-info { flex: 1; }
        .game-title { font-weight: 700; font-size: 16px; margin-bottom: 4px; font-family: sans-serif; }
        .game-status { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; font-family: sans-serif; }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 5px var(--primary); }
        .status-dot.offline { background: var(--text-muted); box-shadow: none; }

        .btn {
            width: 100%; padding: 14px; border: 1px solid var(--primary); border-radius: 6px;
            font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s;
            background: var(--primary-dim); color: var(--primary); text-transform: uppercase; letter-spacing: 1px;
        }
        .btn:active { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary-dim); }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; border-color: #333; color: #555; background: transparent; box-shadow: none; }
        .btn-outline { background: transparent; border: 1px solid #333; color: var(--text-muted); }

        .form-input {
            width: 100%; padding: 14px; background: #000; border: 1px solid #333;
            border-radius: 6px; color: var(--primary); font-size: 16px; outline: none;
            margin-bottom: 12px; text-align: center; letter-spacing: 2px; font-family: monospace;
        }
        .form-input:focus { border-color: var(--primary); box-shadow: 0 0 10px var(--primary-dim); }

        .bottom-nav {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(17,17,17,0.95); backdrop-filter: blur(15px);
            padding: 12px 24px; border-radius: 30px; display: flex; gap: 32px;
            border: 1px solid var(--border); z-index: 90;
        }
        .nav-item { color: var(--text-muted); font-size: 20px; cursor: pointer; transition: 0.2s; }
        .nav-item.active { color: var(--primary); text-shadow: 0 0 10px var(--primary-dim); }

        #admin-overlay {
            position: fixed; inset: 0; background: var(--bg); z-index: 200;
            display: none; flex-direction: column; padding: 20px; overflow-y: auto;
            border-left: 2px solid var(--primary);
        }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
        .admin-section { background: var(--card-bg); padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--border); }
        .form-label { display: block; font-size: 12px; color: var(--primary); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .form-select {
            width: 100%; padding: 12px; background: #000; border: 1px solid #333;
            border-radius: 6px; color: white; font-size: 14px; outline: none; margin-bottom: 16px;
        }
        .key-list { max-height: 300px; overflow-y: auto; }
        .key-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px; border-bottom: 1px solid #222; font-size: 12px; font-family: monospace;
        }
        .key-actions { display: flex; gap: 8px; }
        .btn-sm { padding: 6px 12px; font-size: 10px; border-radius: 4px; border: none; cursor: pointer; text-transform: uppercase; }
        .btn-danger { background: rgba(255, 51, 51, 0.1); color: var(--danger); border: 1px solid var(--danger); }
        .btn-copy { background: rgba(255,255,255,0.05); color: white; border: 1px solid #444; }

        #password-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 300;
            display: none; justify-content: center; align-items: center; backdrop-filter: blur(5px);
        }
        .modal-content {
            background: var(--card-bg); padding: 30px; border-radius: 8px;
            width: 90%; max-width: 320px; text-align: center; border: 1px solid var(--primary);
            box-shadow: 0 0 30px var(--primary-dim);
        }

        .toast {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: var(--primary); color: #000; padding: 12px 24px; border-radius: 4px;
            font-size: 14px; font-weight: bold; z-index: 400; opacity: 0; transition: opacity 0.3s;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .toast.show { opacity: 1; }
    </style>

<script>
    const ADMIN_PASS = "daniel2014";
    let clickCount = 0;
    let clickTimer = null;
    
    const getKeys = () => JSON.parse(localStorage.getItem('kx_keys') || '[]');
    const saveKeys = (keys) => localStorage.setItem('kx_keys', JSON.stringify(keys));
    let currentUserSession = JSON.parse(localStorage.getItem('kx_session') || 'null');

    function updateTimer() {
        const container = document.getElementById('active-timer-container');
        const display = document.getElementById('timer-display');
        const startBtn = document.getElementById('start-btn');
        if (!currentUserSession) {
            container.style.display = 'none';
            startBtn.disabled = true;
            startBtn.textContent = "[ AVVIA MODULO ]";
            return;
        }
        const now = Math.floor(Date.now() / 1000);
        const remaining = currentUserSession.expiresAt - now;
        if (remaining <= 0) {
            localStorage.removeItem('kx_session');
            currentUserSession = null;
            showToast("SESSION_EXPIRED");
            updateTimer();
            return;
        }
        container.style.display = 'block';
        startBtn.disabled = false;
        const h = Math.floor(remaining / 3600);
        const m = Math.floor((remaining % 3600) / 60);
        const s = remaining % 60;
        display.textContent = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    }
    setInterval(updateTimer, 1000);
    updateTimer();

    function validateUserKey() {
        const input = document.getElementById('user-key-input').value.trim().toUpperCase();
        const keys = getKeys();
        const keyData = keys.find(k => k.value === input);
        const now = Math.floor(Date.now() / 1000);
        if (!keyData) return showToast("INVALID_KEY");
        if (keyData.revoked) return showToast("KEY_REVOKED_BY_ADMIN");
        if (keyData.expiresAt && now > keyData.expiresAt) return showToast("KEY_EXPIRED");
        currentUserSession = { key: keyData.value, expiresAt: keyData.expiresAt, deviceType: keyData.deviceType };
        localStorage.setItem('kx_session', JSON.stringify(currentUserSession));
        showToast("ACCESS_GRANTED");
        updateTimer();
    }

    function launchGame() {
        if (!currentUserSession) return showToast("NO_ACTIVE_SESSION");
        const pkg = "com.miniclip.eightballpool";
        const fallback = `https://play.google.com/store/apps/details?id=${pkg}`;
        const btn = document.getElementById('start-btn');
        btn.textContent = "[ LOADING... ]";
        setTimeout(() => {
            window.location.href = `intent://#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=${pkg};S.browser_fallback_url=${encodeURIComponent(fallback)};end`;
            btn.textContent = "[ AVVIA MODULO ]";
        }, 800);
    }

    document.getElementById('logo-trigger').addEventListener('click', () => {
        clickCount++;
        clearTimeout(clickTimer);
        clickTimer = setTimeout(() => clickCount = 0, 2000);
        if (clickCount >= 5) {
            document.getElementById('password-modal').style.display = 'flex';
            clickCount = 0;
        }
    });

    function checkPassword() {
        if (document.getElementById('admin-pass').value === ADMIN_PASS) {
            document.getElementById('password-modal').style.display = 'none';
            document.getElementById('admin-overlay').style.display = 'flex';
            renderKeys();
            document.getElementById('admin-pass').value = '';
        } else {
            showToast("AUTH_FAILED");
        }
    }

    function closeAdmin() { document.getElementById('admin-overlay').style.display = 'none'; }

    function generateKey() {
        const hours = parseInt(document.getElementById('key-duration').value);
        const devType = document.getElementById('key-device-type').value;
        const now = Math.floor(Date.now() / 1000);
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        let key = '';
        for(let i=0; i<12; i++) {
            if(i>0 && i%4===0) key += '-';
            key += chars[Math.floor(Math.random() * chars.length)];
        }
        const newKey = { value: key, createdAt: now, expiresAt: hours ? now + (hours * 3600) : null, deviceType: devType, revoked: false };
        const keys = getKeys();
        keys.unshift(newKey);
        saveKeys(keys);
        renderKeys();
        showToast("KEY_GENERATED");
    }

    function renderKeys() {
        const container = document.getElementById('keys-container');
        const keys = getKeys();
        container.innerHTML = keys.map((k, index) => {
            const expDate = k.expiresAt ? new Date(k.expiresAt * 1000).toLocaleString() : 'LIFETIME';
            const statusColor = k.revoked ? '#ff3333' : '#00ff41';
            return `<div class="key-item"><div><div style="font-weight:600; color:${statusColor}">${k.value}</div><div style="color:#555; font-size:10px; margin-top:4px">EXP: ${expDate} | ${k.deviceType === 'single' ? '1_DEV' : 'MULTI'}</div></div><div class="key-actions"><button class="btn-sm btn-copy" onclick="copyKey('${k.value}')">CPY</button><button class="btn-sm btn-danger" onclick="toggleRevoke(${index})">${k.revoked ? 'UNBAN' : 'BAN'}</button><button class="btn-sm btn-danger" style="background:transparent; border-color:#333; color:#555;" onclick="deleteKey(${index})">DEL</button></div></div>`;
        }).join('');
