<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeForge Astra - Dev Toolkit</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans pb-24">

    <!-- HEADER -->
    <header class="flex justify-between items-center px-4 py-3 bg-slate-900 border-b border-slate-800 sticky top-0 z-40 shadow-md">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-lg bg-emerald-500/10 text-emerald-400 flex items-center justify-center font-bold">
                <i class="fa-solid fa-code"></i>
            </div>
            <h1 class="text-lg font-bold tracking-wide text-white">CodeForge <span class="text-emerald-400">Astra</span></h1>
        </div>
        <span class="text-xs bg-slate-800 text-emerald-400 border border-emerald-500/20 px-2.5 py-1 rounded-full font-mono">v1.0 Pro</span>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- TAB 1: FORMATTAZIONE & JSON -->
        <div id="section-json" class="tool-section space-y-3">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-sm">
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider"><i class="fa-solid fa-brackets-curly text-emerald-400 mr-1"></i> Formattatore JSON</label>
                    <button onclick="clearText('json-input')" class="text-xs text-slate-500 hover:text-red-400"><i class="fa-solid fa-trash-can mr-1"></i> Pulisci</button>
                </div>
                <textarea id="json-input" placeholder="Incolla qui il tuo JSON o codice disordinato..." class="w-full h-32 bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm font-mono text-emerald-300 focus:outline-none focus:border-emerald-500 resize-none"></textarea>
                
                <div class="grid grid-cols-2 gap-2 mt-3">
                    <button onclick="formatJSON()" class="bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-semibold py-2.5 px-4 rounded-xl text-xs transition shadow-sm flex items-center justify-center">
                        <i class="fa-solid fa-wand-magic-sparkles mr-1.5"></i> Beautify / Formatta
                    </button>
                    <button onclick="minifyJSON()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold py-2.5 px-4 rounded-xl text-xs transition border border-slate-700 flex items-center justify-center">
                        <i class="fa-solid fa-compress mr-1.5"></i> Minifica
                    </button>
                </div>
            </div>
        </div>

        <!-- TAB 2: BASE64 TOOL -->
        <div id="section-base64" class="tool-section hidden space-y-3">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-sm">
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider"><i class="fa-solid fa-lock text-cyan-400 mr-1"></i> Base64 Encoder / Decoder</label>
                    <button onclick="clearText('base64-input')" class="text-xs text-slate-500 hover:text-red-400"><i class="fa-solid fa-trash-can mr-1"></i> Pulisci</button>
                </div>
                <textarea id="base64-input" placeholder="Scrivi il testo o la stringa Base64..." class="w-full h-32 bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm font-mono text-cyan-300 focus:outline-none focus:border-cyan-500 resize-none"></textarea>
                
                <div class="grid grid-cols-2 gap-2 mt-3">
                    <button onclick="encodeBase64()" class="bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-semibold py-2.5 px-4 rounded-xl text-xs transition shadow-sm flex items-center justify-center">
                        <i class="fa-solid fa-file-arrow-up mr-1.5"></i> Codifica
                    </button>
                    <button onclick="decodeBase64()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold py-2.5 px-4 rounded-xl text-xs transition border border-slate-700 flex items-center justify-center">
                        <i class="fa-solid fa-file-arrow-down mr-1.5"></i> Decodifica
                    </button>
                </div>
            </div>
        </div>

        <!-- TAB 3: STATISTICHE TESTO -->
        <div id="section-stats" class="tool-section hidden space-y-3">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-sm">
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 block"><i class="fa-solid fa-chart-bar text-purple-400 mr-1"></i> Analizzatore di Codice / Testo</label>
                <textarea id="stats-input" oninput="updateStats()" placeholder="Digita o incolla del testo per analizzarlo in tempo reale..." class="w-full h-32 bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm font-mono text-purple-300 focus:outline-none focus:border-purple-500 resize-none"></textarea>
                
                <div class="grid grid-cols-3 gap-2 mt-3 text-center">
                    <div class="bg-slate-950 border border-slate-800 p-2.5 rounded-xl">
                        <span id="stat-chars" class="block text-lg font-bold text-white">0</span>
                        <span class="text-[10px] text-slate-400 uppercase">Caratteri</span>
                    </div>
                    <div class="bg-slate-950 border border-slate-800 p-2.5 rounded-xl">
                        <span id="stat-words" class="block text-lg font-bold text-white">0</span>
                        <span class="text-[10px] text-slate-400 uppercase">Parole</span>
                    </div>
                    <div class="bg-slate-950 border border-slate-800 p-2.5 rounded-xl">
                        <span id="stat-lines" class="block text-lg font-bold text-white">0</span>
                        <span class="text-[10px] text-slate-400 uppercase">Righe</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB 4: MIEI SNIPPET (LOCAL STORAGE) -->
        <div id="section-snippets" class="tool-section hidden space-y-3">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-sm space-y-3">
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider block"><i class="fa-solid fa-bookmark text-amber-400 mr-1"></i> Salva i tuoi Snippet</label>
                <input type="text" id="snippet-title" placeholder="Titolo dello script (es. Bot Python Webhook)..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
                <textarea id="snippet-code" placeholder="Incolla il codice da salvare..." class="w-full h-24 bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs font-mono text-amber-300 focus:outline-none focus:border-amber-500 resize-none"></textarea>
                <button onclick="saveSnippet()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-semibold py-2.5 rounded-xl text-xs transition shadow-sm">
                    <i class="fa-solid fa-floppy-disk mr-1.5"></i> Salva nel Browser
                </button>
            </div>

            <div id="snippets-list" class="space-y-2">
                <!-- I frammenti salvati appariranno qui -->
            </div>
        </div>

        <!-- OUTPUT BOX CONDIVISO -->
        <div id="output-box" class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-sm hidden">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-semibold text-emerald-400 uppercase tracking-wider"><i class="fa-solid fa-terminal mr-1"></i> Risultato</span>
                <button onclick="copyOutput()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-700 transition"><i class="fa-solid fa-copy mr-1"></i> Copia</button>
            </div>
            <pre id="output-content" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs font-mono text-slate-200 overflow-x-auto max-h-40 whitespace-pre-wrap"></pre>
        </div>

    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 py-2 px-4 flex justify-around items-center z-40 max-w-md mx-auto shadow-xl">
        <button onclick="switchTab('json')" class="nav-btn flex flex-col items-center text-emerald-400" data-tab="json">
            <i class="fa-solid fa-brackets-curly text-base"></i>
            <span class="text-[10px] mt-1 font-medium">JSON</span>
        </button>
        <button onclick="switchTab('base64')" class="nav-btn flex flex-col items-center text-slate-500 hover:text-slate-300" data-tab="base64">
            <i class="fa-solid fa-lock text-base"></i>
            <span class="text-[10px] mt-1 font-medium">Base64</span>
        </button>
        <button onclick="switchTab('stats')" class="nav-btn flex flex-col items-center text-slate-500 hover:text-slate-300" data-tab="stats">
            <i class="fa-solid fa-chart-bar text-base"></i>
            <span class="text-[10px] mt-1 font-medium">Analisi</span>
        </button>
        <button onclick="switchTab('snippets')" class="nav-btn flex flex-col items-center text-slate-500 hover:text-slate-300" data-tab="snippets">
            <i class="fa-solid fa-bookmark text-base"></i>
            <span class="text-[10px] mt-1 font-medium">Snippet</span>
        </button>
    </nav>

    <!-- JAVASCRIPT -->
    <script>
        let savedSnippets = JSON.parse(localStorage.getItem('codeforge_snippets')) || [];

        function switchTab(tabName) {
            document.querySelectorAll('.tool-section').forEach(el => el.classList.add('hidden'));
            document.getElementById('section-' + tabName).classList.remove('hidden');

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-emerald-400');
                btn.classList.add('text-slate-500');
                if(btn.getAttribute('data-tab') === tabName) {
                    btn.classList.remove('text-slate-500');
                    btn.classList.add('text-emerald-400');
                }
            });

            if(tabName === 'snippets') renderSnippets();
        }

        function showOutput(text) {
            const box = document.getElementById('output-box');
            const content = document.getElementById('output-content');
            box.classList.remove('hidden');
            content.innerText = text;
        }

        function clearText(elementId) {
            document.getElementById(elementId).value = '';
            document.getElementById('output-box').classList.add('hidden');
        }

        function formatJSON() {
            try {
                const val = document.getElementById('json-input').value;
                const parsed = JSON.parse(val);
                showOutput(JSON.stringify(parsed, null, 4));
            } catch (e) {
                showOutput('Errore JSON non valido: ' + e.message);
            }
        }

        function minifyJSON() {
            try {
                const val = document.getElementById('json-input').value;
                const parsed = JSON.parse(val);
                showOutput(JSON.stringify(parsed));
            } catch (e) {
                showOutput('Errore JSON non valido: ' + e.message);
            }
        }

        function encodeBase64() {
            try {
                const val = document.getElementById('base64-input').value;
                const encoded = btoa(unescape(encodeURIComponent(val)));
                showOutput(encoded);
            } catch (e) {
                showOutput('Errore di codifica: ' + e.message);
            }
        }

        function decodeBase64() {
            try {
                const val = document.getElementById('base64-input').value;
                const decoded = decodeURIComponent(escape(atob(val)));
                showOutput(decoded);
            } catch (e) {
                showOutput('Errore di decodifica (stringa non valida): ' + e.message);
            }
        }

        function updateStats() {
            const val = document.getElementById('stats-input').value;
            document.getElementById('stat-chars').innerText = val.length;
            document.getElementById('stat-words').innerText = val.trim() === '' ? 0 : val.trim().split(/\s+/).length;
            document.getElementById('stat-lines').innerText = val.split('\n').length;
        }

        function copyOutput() {
            const text = document.getElementById('output-content').innerText;
            navigator.clipboard.writeText(text);
            alert('Copiato negli appunti!');
        }

        function saveSnippet() {
            const title = document.getElementById('snippet-title').value;
            const code = document.getElementById('snippet-code').value;
            if(!title || !code) {
                alert('Inserisci un titolo e del codice!');
                return;
            }
            savedSnippets.push({ title, code });
            localStorage.setItem('codeforge_snippets', JSON.stringify(savedSnippets));
            document.getElementById('snippet-title').value = '';
            document.getElementById('snippet-code').value = '';
            renderSnippets();
            alert('Snippet salvato!');
        }

        function renderSnippets() {
            const list = document.getElementById('snippets-list');
            if(savedSnippets.length === 0) {
                list.innerHTML = '<div class="bg-slate-900 border border-slate-800 rounded-xl p-4 text-center text-slate-500 text-xs">Nessun snippet salvato.</div>';
                return;
            }
            list.innerHTML = '';
            savedSnippets.forEach((s, idx) => {
                list.innerHTML += `
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 space-y-2">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-xs text-amber-300">${s.title}</span>
                            <div class="space-x-1">
                                <button onclick="navigator.clipboard.writeText(${JSON.stringify(s.code)}); alert('Copiato!');" class="text-xs bg-slate-800 px-2 py-1 rounded text-slate-300">Copia</button>
                                <button onclick="deleteSnippet(${idx})" class="text-xs bg-red-500/10 text-red-400 px-2 py-1 rounded">Elimina</button>
                            </div>
                        </div>
                        <pre class="bg-slate-950 p-2 rounded-lg text-[10px] font-mono text-slate-400 overflow-x-auto max-h-20">${s.code}</pre>
                    </div>
                `;
            });
        }

        function deleteSnippet(index) {
            savedSnippets.splice(index, 1);
            localStorage.setItem('codeforge_snippets', JSON.stringify(savedSnippets));
            renderSnippets();
        }
    </script>
</body>
</html>
