<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotifree - YouTube Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            height: 100vh;
            display: grid;
            grid-template-rows: 1fr 90px;
            grid-template-columns: 240px 1fr;
            grid-template-areas: 
                "sidebar main"
                "player player";
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            grid-area: sidebar;
            background-color: #000;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .logo span {
            color: #1db954;
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .nav-links li a {
            color: #b3b3b3;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: color 0.2s;
        }

        .nav-links li a:hover, .nav-links li a.active {
            color: #fff;
        }

        /* Main Content */
        .main-content {
            grid-area: main;
            background: linear-gradient(180deg, #222 0%, #121212 100%);
            margin: 8px 8px 0 0;
            border-radius: 8px;
            padding: 24px;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .search-bar {
            background-color: #242424;
            border: none;
            padding: 10px 16px;
            border-radius: 500px;
            color: #fff;
            width: 300px;
            font-size: 14px;
            outline: none;
        }

        .search-bar::placeholder {
            color: #b3b3b3;
        }

        .welcome-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .playlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .playlist-card {
            background-color: #181818;
            padding: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .playlist-card:hover {
            background-color: #282828;
        }

        .playlist-card img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .playlist-card h4 {
            font-size: 16px;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-card p {
            color: #b3b3b3;
            font-size: 14px;
        }

        /* Bottom Player Bar */
        .player-bar {
            grid-area: player;
            background-color: #181818;
            border-top: 1px solid #282828;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }

        .current-song {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 30%;
        }

        .current-song img {
            width: 56px;
            height: 56px;
            border-radius: 4px;
            object-fit: cover;
        }

        .song-info h4 {
            font-size: 14px;
            color: #fff;
        }

        .song-info p {
            font-size: 12px;
            color: #b3b3b3;
        }

        .player-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 40%;
        }

        .control-buttons {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .control-buttons button {
            background: none;
            border: none;
            color: #b3b3b3;
            cursor: pointer;
            font-size: 18px;
            transition: color 0.2s;
        }

        .control-buttons button:hover {
            color: #fff;
        }

        .control-buttons button.play-btn {
            background-color: #fff;
            color: #000;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .progress-bar-container {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            font-size: 11px;
            color: #b3b3b3;
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            background-color: #4d4d4d;
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-bar-filled {
            width: 0%;
            height: 100%;
            background-color: #1db954;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <!-- Lettore YouTube nascosto -->
    <div id="youtube-player" style="display:none;"></div>

    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="logo">🟢 Spotifree</div>
        <ul class="nav-links">
            <li><a href="#" class="active">🏠 Home</a></li>
            <li><a href="#">🔍 Cerca</a></li>
            <li><a href="#">📚 La tua libreria</a></li>
        </ul>
    </nav>

    <!-- Schermata Principale -->
    <main class="main-content">
        <div class="header">
            <h1 class="welcome-title">I tuoi brani da YouTube</h1>
            <input type="text" class="search-bar" placeholder="Cerca una canzone o incolla ID YouTube..." id="search-input" onkeypress="handleSearch(event)">
        </div>
        
        <div class="playlist-grid" id="playlist-container">
            <!-- Le card si caricheranno qui o possono essere aggiunte a mano -->
            <div class="playlist-card" onclick="playTrack('jfKfPfyJRdk', 'Lofi Hip Hop Radio', 'Lofi Girl', 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300')">
                <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300" alt="Cover">
                <h4>Lofi Hip Hop Radio</h4>
                <p>Lofi Girl (YouTube Stream)</p>
            </div>
            <div class="playlist-card" onclick="playTrack('5qap5aO4i9A', 'Lofi Beats to Relax', 'Study Music', 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300')">
                <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300" alt="Cover">
                <h4>Lofi Beats to Relax</h4>
                <p>Study Music</p>
            </div>
        </div>
    </main>

    <!-- Barra di Riproduzione in basso -->
    <footer class="player-bar">
        <div class="current-song">
            <img id="current-cover" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=100" alt="Song">
            <div class="song-info">
                <h4 id="current-title">Seleziona un brano</h4>
                <p id="current-artist">-</p>
            </div>
        </div>
        
        <div class="player-controls">
            <div class="control-buttons">
                <button onclick="togglePlay()" class="play-btn" id="play-icon">▶</button>
            </div>
            <div class="progress-bar-container">
                <span id="current-time">0:00</span>
                <div class="progress-bar" id="progress-container">
                    <div class="progress-bar-filled" id="progress-filled"></div>
                </div>
                <span id="total-duration">0:00</span>
            </div>
        </div>
        
        <div style="width: 30%;"></div>
    </footer>

    <!-- Script YouTube IFrame API -->
    <script>
        let player;
        let isPlaying = false;
        let progressInterval;

        // Carica l'API di YouTube in modo asincrono
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '0',
                width: '0',
                videoId: '',
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function playTrack(videoId, title, artist, cover) {
            if (!player) return;
            player.loadVideoById(videoId);
            document.getElementById('current-title').textContent = title;
            document.getElementById('current-artist').textContent = artist;
            document.getElementById('current-cover').src = cover;
            document.getElementById('play-icon').textContent = "⏸";
            isPlaying = true;
            startProgressTracker();
        }

        function togglePlay() {
            if (!player) return;
            const state = player.getPlayerState();
            if (state === YT.PlayerState.PLAYING) {
                player.pauseVideo();
                document.getElementById('play-icon').textContent = "▶";
                isPlaying = false;
            } else {
                player.playVideo();
                document.getElementById('play-icon').textContent = "⏸";
                isPlaying = true;
            }
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                document.getElementById('play-icon').textContent = "⏸";
                isPlaying = true;
            } else if (event.data === YT.PlayerState.PAUSED) {
                document.getElementById('play-icon').textContent = "▶";
                isPlaying = false;
            }
        }

        function startProgressTracker() {
            clearInterval(progressInterval);
            progressInterval = setInterval(() => {
                if (isPlaying && player && player.getDuration) {
                    const current = player.getCurrentTime();
                    const duration = player.getDuration();
                    const percent = (current / duration) * 100;
                    document.getElementById('progress-filled').style.width = `${percent}%`;
                    document.getElementById('current-time').textContent = formatTime(current);
                    document.getElementById('total-duration').textContent = formatTime(duration);
                }
            }, 500);
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function handleSearch(e) {
            if (e.key === 'Enter') {
                const query = e.target.value;
                alert("Hai cercato: " + query + "\nPuoi aggiungere facilmente qualsiasi ID video di YouTube alle tue card personalizzate!");
            }
        }
    </script>
</body>
</html>
